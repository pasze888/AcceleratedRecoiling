// Native collision library build.
//
// A single host zig cross-compiles all four shipped platforms from one ISA
// agnostic source; there is no CMake, no JNI headers and no C++ toolchain
// download. Zig must be on PATH (0.16.x).

def zig = providers.gradleProperty('zig_executable').getOrElse('zig')
def nativeSource = layout.projectDirectory.dir('native')
def nativeBuildRoot = layout.buildDirectory.dir('native-zig')
def nativeResources = layout.buildDirectory.dir('generated/realtime-natives')

// Zig target triples and the library name each platform packages under.
// Zig installs DLLs under bin/ and everything else under lib/.
def targets = [
        'windows-x64': ['x86_64-windows-gnu', 'bin/AcceleratedRecoilingRealtime.dll'],
        'linux-x64': ['x86_64-linux-gnu', 'lib/libAcceleratedRecoilingRealtime.so'],
        'macos-x64': ['x86_64-macos-none', 'lib/libAcceleratedRecoilingRealtime.dylib'],
        'macos-arm64': ['aarch64-macos-none', 'lib/libAcceleratedRecoilingRealtime.dylib']
]

def libraries = [:]
def zigTasks = [:]
targets.each { platform, target ->
    def taskSuffix = platform.tokenize('-').collect { it.capitalize() }.join('')
    def prefix = nativeBuildRoot.map { it.dir(platform) }
    def library = prefix.map { it.file(target[1]) }

    zigTasks[platform] = tasks.register("zigBuild" + taskSuffix, Exec) {
        group = 'build native'
        description = "Compile the realtime collision library for " + platform + "."
        inputs.dir(nativeSource)
        inputs.property('zigExecutable', zig)
        inputs.property('target', target[0])
        outputs.file(library)

        commandLine zig, 'build', '-Doptimize=ReleaseFast', "-Dtarget=" + target[0],
                '--prefix', prefix.get().asFile.absolutePath
        workingDir nativeSource
        // A read-only global cache is common on CI images; keep both caches
        // inside the build directory so the task is hermetic.
        environment 'ZIG_GLOBAL_CACHE_DIR', prefix.get().dir('.zig-global').asFile.absolutePath
        environment 'ZIG_LOCAL_CACHE_DIR', prefix.get().dir('.zig-cache').asFile.absolutePath
    }
    libraries[platform] = library
}

tasks.register('compileRealtimeNative') {
    group = 'build native'
    dependsOn zigTasks.values()
}

// Differential tests (scalar oracle vs vector/spatial paths). The build runs
// two binaries, one pinned to baseline and one for this machine, so the higher
// ISA objects are actually executed.
tasks.register('testRealtimeKernel', Exec) {
    group = 'verification'
    description = 'Run the Zig collision kernel differential tests.'
    inputs.dir(nativeSource)
    commandLine zig, 'build', 'test'
    workingDir nativeSource
    environment 'ZIG_GLOBAL_CACHE_DIR', layout.buildDirectory.dir('zig-test-global').get().asFile.absolutePath
    environment 'ZIG_LOCAL_CACHE_DIR', layout.buildDirectory.dir('zig-test-cache').get().asFile.absolutePath
}

def copyNativeLibraries = tasks.register('copyRealtimeNative', Sync) {
    dependsOn zigTasks.values()
    libraries.each { platform, library ->
        from(library) { into "natives/" + platform }
    }
    into nativeResources
}
sourceSets.main.resources.srcDir nativeResources
tasks.named('processResources') { dependsOn copyNativeLibraries }
